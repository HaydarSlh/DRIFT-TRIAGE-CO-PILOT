[project]
name = "drift-triage-agent"
version = "0.1.0"
description = "Week 5 — drift triage multi-agent: supervisor → triage → action → comms with HIL approval before Production-touching actions."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "langgraph>=0.2",
    "langgraph-checkpoint-redis>=0.0.5",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
    "langchain-google-genai>=1.0",
    "langsmith>=0.1.100",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "redis>=5.0",
    "arq>=0.25",
    "tenacity>=8.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "syrupy>=4.6",
    "freezegun>=1.5",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-requests>=2.31",
    "fakeredis>=2.21",
]

[project.scripts]
triage-replay = "app.cli.replay:main"
triage-replay-local = "app.cli.replay_local:main"
triage-queue-admin = "app.cli.queue_admin:main"
triage-worker = "app.workers.runner:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: integration tests that need Postgres + Redis",
    "snapshot: trajectory snapshot tests",
    "queue: tests that hit the queue layer (need Redis)",
    "worker: tests that need a live arq worker process",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]