version: "3.11"

services:
  platform:
    build: ./platform
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  agent:
    build: ./agent
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      - platform
      - redis

  worker:
    build: ./worker
    env_file: .env
    depends_on:
      - redis

  dashboard:
    build: ./dashboard
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      - platform

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
