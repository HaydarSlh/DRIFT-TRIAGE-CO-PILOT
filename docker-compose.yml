services:

  platform:
    build:
      context: .                          # project root
      dockerfile: ml_platform/Dockerfile   # path to your existing Dockerfile
    env_file: .env
    environment:
      - PLATFORM_WEBHOOK_SECRET=supersecrets
    ports:
      - "8080:8000"                        # platform API (host:8080 → container:8000)
      - "5000:5000"                        # MLflow tracking server UI
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./mlruns:/app/mlruns                # persist MLflow DB
      - ./data:/app/data                 # (optional) live‑reload data
      - ./artifacts:/app/artifacts         # (optional) live‑reload artifacts
      - ./scripts:/app/scripts
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/db
    command: ["uv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  agent:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    environment:
      - POSTGRES_URI=postgresql://postgres:postgres@postgres:5432/db
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/db
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_REDIS_URL=redis://redis:6379/3
      - PLATFORM_URL=http://platform:8000
      - JOB_TIMEOUT_S=300
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      

  worker:
    build:
      context: .
      dockerfile: app/Dockerfile.worker
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/db
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_REDIS_URL=redis://redis:6379/3
      - PLATFORM_URL=http://platform:8000
      - JOB_TIMEOUT_S=300
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard:
    build: ./dashboard
    env_file: .env
    environment:
      - AGENT_URL=http://agent:8001
      - PLATFORM_URL=http://platform:8000
      - MLFLOW_URL=http://platform:5000
      - MLFLOW_TRACKING_URI=http://platform:5000
      - DASHBOARD_DB_PATH=/app/data/dashboard.db
    ports:
      - "8501:8501"
    volumes:
      - dashboard_data:/app/data
    depends_on:
      platform:
        condition: service_healthy
      agent:
        condition: service_started
 

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 3s
      timeout: 5s
      retries: 15

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  mlruns:
  redis_data:
  dashboard_data:
