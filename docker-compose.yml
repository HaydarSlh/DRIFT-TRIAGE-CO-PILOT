services:

  platform:
    build:
      context: .                          # project root
      dockerfile: ml_platform/Dockerfile   # path to your existing Dockerfile
    env_file: .env
    environment:
      - PLATFORM_WEBHOOK_SECRET=supersecrets
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./mlruns:/app/mlruns                # persist MLflow DB
      - ./data:/app/data                 # (optional) live‑reload data
      - ./artifacts:/app/artifacts         # (optional) live‑reload artifacts
      - ./scripts:/app/scripts 

  agent:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    environment:
      - POSTGRES_URI=postgresql://postgres:postgres@postgres:5432/db
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/db
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_REDIS_URL=redis://redis:6379/0 
    ports:
      - "8001:8001"
    depends_on:
      - platform
      - redis

  worker:
    build:
      context: .
      dockerfile: app/Dockerfile.worker
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_REDIS_URL=redis://redis:6379/0  
    depends_on:
        redis:
          condition: service_healthy

  dashboard:
    build: ./dashboard
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      - platform

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  mlruns:
  redis_data: