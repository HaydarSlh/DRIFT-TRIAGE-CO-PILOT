version: "3.12"

services:

  platform:
    build:
      context: .                          # project root
      dockerfile: ml_platform/Dockerfile   # path to your existing Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - mlruns:/app/mlruns                 # persist MLflow DB
      - ./data:/app/data                   # (optional) live‑reload data
      - ./artifacts:/app/artifacts          # (optional) live‑reload artifacts

  agent:
    build: ./agent
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      - platform
      - redis

  worker:
    build: ./worker
    env_file: .env
    depends_on:
      - redis

  dashboard:
    build: ./dashboard
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      - platform

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
  mlruns: